# Open-source stack: Operaton (Camunda 7 fork, Apache-2.0) + Postgres + Python workers.
services:
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: operaton, POSTGRES_USER: operaton, POSTGRES_PASSWORD: operaton}
    volumes: [pgdata:/var/lib/postgresql/data]
  engine:
    image: operaton/operaton:latest       # bundles engine, REST (/engine-rest), Cockpit, Tasklist, Admin
    depends_on: [db]
    ports: ["8080:8080"]
    environment:
      DB_DRIVER: org.postgresql.Driver
      DB_URL: jdbc:postgresql://db:5432/operaton
      DB_USERNAME: operaton
      DB_PASSWORD: operaton
      WAIT_FOR: db:5432
  vectordb:
    image: pgvector/pgvector:pg16
    environment: {POSTGRES_PASSWORD: pw}
    volumes: [vecdata:/var/lib/postgresql/data]
  ai:
    build: {context: ., dockerfile: ai/Dockerfile}
    depends_on: [vectordb]
    restart: on-failure
    ports: ["8090:8090"]
    environment:
      VECTOR_DSN: postgresql://postgres:pw@vectordb:5432/postgres
      AI_DB_DSN: postgresql://postgres:pw@vectordb:5432/postgres
      LEDGER_DB: /data/ledger.db
      AI_PROVIDER: ${AI_PROVIDER:-mock}        # set AZURE_OPENAI_* / ANTHROPIC_API_KEY in your shell for real models
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_DEPLOY_SMALL: ${AZURE_DEPLOY_SMALL:-}
      AZURE_DEPLOY_LARGE: ${AZURE_DEPLOY_LARGE:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes: [ledger:/data]
  workers:
    build: {context: ., dockerfile: workers/Dockerfile}
    depends_on: [engine]
    environment:
      ENGINE_URL: http://engine:8080/engine-rest
      AI_SERVICE_URL: http://ai:8090
      DEMO_SEED: "1"
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_TRACE_DB: /data/worker_traces.db
      DUE_IN: ${DUE_IN:-P30D}
      GRACE_IN: ${GRACE_IN:-P15D}
      PAYOUT_SLA: ${PAYOUT_SLA:-P5D}
    volumes: [ledger:/data, ./data/inbox:/data/inbox:ro, ./data/records_in:/data/records_in:ro]
volumes: {pgdata: {}, vecdata: {}, ledger: {}}
